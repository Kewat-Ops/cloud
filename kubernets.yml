#------python----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python
  labels:
    app: python-app
# specification for pods (wrapper)
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  #blueprints for pods
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: python-container
          image: $DOCKER_CREDS_USR/cloud-python:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: python-services
spec:
  selector:
    app: python-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
